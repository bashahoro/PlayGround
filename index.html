<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false}),W=256,H=240,T=16,keys=new Set();ctx.imageSmoothingEnabled=false;
const PAL={sky:'#5c94fc',blue:'#0b30e0',dark:'#6b2b0b',brown:'#b85b18',gold:'#f8b820',cream:'#fff0c8',red:'#e83b24',green:'#00a800',pipe:'#00a800',black:'#171717',white:'#fff'};
let mode='title',muted=false,audio=null,last=0,acc=0,worldTime=400,score=0,coins=0,lives=3,level=1,cam=0,shake=0,fireworks=[],bonus=0,ticks=0,musicStep=0,stompCombo=0,comboWindow=0;
const player={x:32,y:190,vx:0,vy:0,w:12,h:16,form:0,face:1,on:false,crouch:false,inv:0,star:0,anim:0,fireCooldown:0};
let blocks=[],enemies=[],items=[],fireballs=[],particles=[],worldWidth=3264;
function makeLevel(){blocks=[];enemies=[];items=[];fireballs=[];particles=[];
// Terrain regions and gaps: World 1-1's measured, readable rhythm.
const pits=[[512,576],[832,896],[1088,1152],[1408,1472],[1728,1792],[2048,2112],[2368,2432],[2752,2816]];
for(let x=0;x<worldWidth;x+=16){if(!pits.some(([a,b])=>x>=a&&x<b))blocks.push({x,y:224,w:16,h:16,type:'ground',solid:true})}

// Opening coin/question formation

// Classic stepped bricks, coins and multi-coin block
row(640,160,1,'brick');row(656,160,1,'question');row(672,160,1,'brick');row(688,160,1,'question');row(704,160,1,'brick');row(720,160,1,'question');row(736,160,1,'brick');row(704,112,1,'question');row(720,112,1,'brick');row(736,112,1,'question');
row(960,160,1,'brick');row(976,160,1,'question');row(992,160,1,'brick');row(1008,160,1,'brick');row(1024,160,1,'brick');
row(1184,160,1,'brick');row(1200,160,1,'question');row(1216,160,1,'brick');row(1232,160,1,'question');row(1248,160,1,'brick');row(1264,160,1,'question');row(1280,160,1,'brick');
// Pipe landmarks, progressively taller
for(const [x,h] of [[448,32],[768,48],[1280,32],[1536,48],[1856,32],[2176,48],[2496,32]]){for(let y=224-h;y<224;y+=16)blocks.push({x,y,w:32,h:16,type:'pipe',solid:true});blocks.push({x:x-2,y:224-h,w:36,h:16,type:'pipeTop',solid:true})}
// staircase columns toward the flag
for(let i=0;i<6;i++)row(2880+i*16,224-(i+1)*16,i+1,'stair');
for(let i=0;i<6;i++)row(3040+i*16,224-(6-i)*16,6-i,'stair');
row(3136,128,1,'hard');row(3152,128,1,'hard');row(3168,128,1,'hard');
// Hidden rewards and coin arcs
blocks.push({x:160,y:128,w:16,h:16,type:'hidden',solid:true,hidden:true,reward:'1up',used:false});
blocks.push({x:400,y:160,w:16,h:16,type:'multi',solid:true,used:false,coins:10});blocks.push({x:1040,y:112,w:16,h:16,type:'hidden',solid:true,hidden:true,reward:'coin',used:false});
for(const [x,y] of [[272,144],[336,144],[400,144],[624,144],[752,144],[944,144],[1056,144],[1168,144],[1312,144],[1344,144],[1376,144],[1600,176],[1632,160],[1664,144],[1904,176],[1936,160],[1968,144],[2224,176],[2256,160],[2288,144]])items.push({type:'coin',x,y,w:8,h:12,vy:0});
// Enemies, spaced so the player can react
for(const x of [208,352,592,688,912,1040,1168,1360,1600,1680,1904,2000,2256,2320,2608,2864,2980])enemies.push({type:'goomba',x,y:208,vx:-.55,w:16,h:16,alive:true,state:'walk',dir:-1});
for(const x of [752,1328,1856,2432,2688])enemies.push({type:'koopa',x,y:208,vx:-.42,w:16,h:16,alive:true,state:'walk',dir:-1});
}
makeLevel();
function sound(name){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);let f=440,d=.12,type='square';const seq={jump:[390,.12,'square'],coin:[988,.1,'square'],stomp:[180,.12,'triangle'],bump:[220,.1,'triangle'],break:[120,.15,'square'],power:[523,.4,'square'],appear:[330,.25,'triangle'],oneup:[660,.4,'square'],fire:[440,.1,'square'],kick:[160,.12,'square'],pipe:[180,.28,'triangle'],die:[300,.5,'triangle'],flag:[660,.5,'square'],clear:[784,.9,'square']};[f,d,type]=seq[name]||[440,.1,'square'];osc.type=type;osc.frequency.setValueAtTime(f,now);if(name==='coin'||name==='oneup'||name==='power'){osc.frequency.exponentialRampToValueAtTime(f*1.5,now+d*.4);osc.frequency.exponentialRampToValueAtTime(f*2,now+d*.8)}if(name==='die')osc.frequency.exponentialRampToValueAtTime(80,now+d);gain.gain.setValueAtTime(.08,now);gain.gain.exponentialRampToValueAtTime(.001,now+d);osc.start(now);osc.stop(now+d)}catch{}}
function setMode(m){mode=m;if(m==='playing')last=performance.now()}
function addScore(n){score+=n}
function stompReward(){if(comboWindow>0)stompCombo++;else stompCombo=0;const rewards=[100,200,400,800,1000,2000,4000,8000];if(stompCombo<rewards.length)addScore(rewards[stompCombo]);else{lives++;sound('oneup')}comboWindow=45}
function addCoin(n=1){coins+=n;addScore(200*n);sound('coin');if(coins>=100){coins-=100;lives++;sound('oneup')}}
function resetPlayer(){Object.assign(player,{x:32,y:190,vx:0,vy:0,w:12,h:16,form:0,face:1,on:false,crouch:false,inv:0,star:0,anim:0});cam=0;worldTime=400}
function startGame(){score=0;coins=0;lives=3;stompCombo=0;comboWindow=0;makeLevel();resetPlayer();try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}setMode('playing')}
function keydown(e){const k=e.code;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(k))e.preventDefault();if(!keys.has(k)){if(k==='Enter'){if(mode==='title'||mode==='over'||mode==='clear')startGame();else setMode(mode==='playing'?'paused':'playing')}if(k==='KeyM')muted=!muted;if((mode==='title'||mode==='over'||mode==='clear')&&(k==='Space'||k==='KeyX'))startGame();if(mode==='paused'&&(k==='Space'||k==='KeyX'))setMode('playing');if(mode==='playing'&&['Space','ArrowUp','KeyX'].includes(k))jump()}keys.add(k)}
function keyup(e){keys.delete(e.code)}window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);window.addEventListener('blur',()=>keys.clear());
document.querySelectorAll('.touch button').forEach(b=>{const code=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!keys.has(code)&&['Space','KeyX','ArrowUp'].includes(code)&&mode==='playing')jump();keys.add(code)});for(const n of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(n,e=>{keys.delete(code)})});
function jump(){if(player.on&&mode==='playing'){player.vy=-5.15-(isRun()?0.45:0);player.on=false;sound('jump')}}
function isRun(){return keys.has('KeyZ')||keys.has('ShiftLeft')||keys.has('ShiftRight')}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function nearby(x,y){return blocks.filter(b=>b.solid&&x<b.x+b.w+2&&x+player.w>b.x-2&&y<b.y+b.h+2&&y+player.h>b.y-2)}
function spawnItem(b,type){items.push({type,x:b.x+4,y:b.y-2,w:8,h:12,vy:type==='mushroom'||type==='flower'||type==='star'?-0.4:0,emerge:10,dir:1})}
function activateBlock(b){if(b.used||b.hidden)return;b.used=true;b.type='used';if(b.coins){let count=b.coins;const timer=setInterval(()=>{if(count--<=0){clearInterval(timer);return}addCoin()},90)}else if(Math.random()<.05){spawnItem(b,'1up');sound('appear')}else{spawnItem(b,player.form===1?'flower':'mushroom');sound('appear')}}
function bumpBlock(b){b.bump=8;sound('bump');if(b.type==='question'||b.type==='multi')activateBlock(b);else if((b.type==='brick'||b.type==='stair')&&player.form>0){b.solid=false;b.broken=true;sound('break');for(let i=0;i<4;i++)particles.push({x:b.x+8,y:b.y+8,vx:(i%2?1:-1)*1.5,vy:i<2?-2:1,life:28,type:'brick'})}}
function physics(){const p=player;p.anim++;p.inv=Math.max(0,p.inv-1);p.star=Math.max(0,p.star-1);p.fireCooldown=Math.max(0,p.fireCooldown-1);p.crouch=(keys.has('ArrowDown')||keys.has('KeyS'))&&p.on&&p.form>0;p.w=12;p.h=p.crouch?14:(p.form>0?24:16);if(p.form>0&&!p.crouch&&p.on)p.y-=.001;
const left=keys.has('ArrowLeft')||keys.has('KeyA'),right=keys.has('ArrowRight')||keys.has('KeyD'),run=isRun();if(left!==right){let input=left?-1:1;p.face=input;const accel=run?.16:.11;p.vx+=input*accel;if(Math.sign(p.vx)!==input)p.vx+=input*.15;const max=run?2.45:1.55;p.vx=Math.max(-max,Math.min(max,p.vx))}else p.vx*=p.on?.76:.98;if(Math.abs(p.vx)<.06)p.vx=0;
if(!keys.has('Space')&&!keys.has('KeyX')&&!keys.has('ArrowUp')&&p.vy< -2.5)p.vy+=.12;
p.vy=Math.min(6,p.vy+.24);const oldX=p.x;p.x+=p.vx;for(const b of nearby(p.x,p.y)){if(overlap(p,b)){if(p.vx>0)p.x=b.x-p.w;else if(p.vx<0)p.x=b.x+b.w;p.vx=0}}
const movingY=p.vy;p.y+=p.vy;p.on=false;for(const b of nearby(p.x,p.y)){if(overlap(p,b)){if(movingY>0){p.y=b.y-p.h;p.vy=0;p.on=true}else if(movingY<0){p.y=b.y+b.h;p.vy=0;bumpBlock(b)}}}
if(p.x<0){p.x=0;p.vx=0}if(p.y>260){die()}
if(p.x>worldWidth-58&&p.y>174){clearCourse()}
// Fireball action, limited rate
if(run&&p.form===2&&keys.has('KeyZ')&&p.fireCooldown===0){fireballs.push({x:p.x+p.w/2+p.face*8,y:p.y+10,vx:p.face*2.7,vy:-1,w:6,h:6,bounces:0});p.fireCooldown=22;sound('fire')}
for(const b of blocks){if(b.bump>0){b.bump--;b.drawY=b.y-(b.bump>4?(8-b.bump)*1.2:(b.bump)*1.2)}else b.drawY=b.y}
updateEntities();cam=Math.max(0,Math.min(worldWidth-W-40,p.x-88));if(shake>0)shake--;
}
function updateEntities(){for(const item of items){if(item.emerge>0){item.emerge--;item.y-=.7;continue}if(['mushroom','1up','flower','star'].includes(item.type)){item.vy=Math.min(3,item.vy+.18);item.y+=item.vy;item.x+=item.dir*.7;for(const b of blocks)if(b.solid&&item.x<b.x+b.w&&item.x+item.w>b.x&&item.y+item.h>b.y&&item.y<b.y+b.h){if(item.vy>0)item.y=b.y-item.h;item.vy=0}if(item.x<0||blocks.some(b=>b.solid&&item.x+item.w>=b.x&&item.x<b.x+4&&item.y+item.h>b.y))item.dir=1;}
if(overlap(player,item)){if(item.type==='coin'){item.dead=true;addCoin()}else if(item.type==='1up'){item.dead=true;lives++;sound('oneup')}else if(item.type==='star'){item.dead=true;player.star=600;sound('power')}else{item.dead=true;if(item.type==='flower'){player.form=2}else player.form=Math.max(1,player.form);player.h=24;player.y-=8;sound('power')}}}
items=items.filter(i=>!i.dead&&i.y<250);
for(const e of enemies){if(!e.alive)continue;if(e.x>cam+W+60)continue;if(e.state==='shell'){if(e.timer>0)e.timer--;else if(Math.abs(e.x-player.x)>110){e.state='walk';e.vx=e.type==='koopa'?.42:.55}if(Math.abs(e.vx)>0)e.x+=e.vx;}
else{e.x+=e.vx;if(e.x<0||e.x>worldWidth-16)e.vx*=-1;for(const b of blocks){if(b.solid&&overlap(e,b)&&e.y+e.h>b.y+2&&e.y<b.y+b.h){e.vx*=-1;e.dir=Math.sign(e.vx);break}}}
if(overlap(player,e)){if(player.star){e.alive=false;addScore(200);continue}if(player.vy>0&&player.y+player.h-e.y<9){player.y=e.y-player.h;player.vy=-3.2;if(e.type==='koopa'){e.state='shell';e.vx=0;e.timer=360;e.h=12;e.y+=4}else{e.state='squash';e.timer=30;e.alive=false}stompReward();sound('stomp')}else if(e.state==='shell'&&Math.abs(e.vx)<.01){e.vx=player.x<e.x?2.4:-2.4;player.vx=-Math.sign(e.vx)*1.2;sound('kick')}else if(player.inv===0){if(player.form>0){player.form--;player.h=16;player.y+=8;player.inv=100;player.vx=-player.face*1.4;sound('power')}else die()}}
if(e.x<cam-40)e.off=true}
enemies=enemies.filter(e=>e.alive&&!e.off);
for(const f of fireballs){f.x+=f.vx;f.vy+=.16;f.y+=f.vy;for(const b of blocks)if(b.solid&&overlap(f,b)){if(f.vy>0&&f.bounces<2){f.y=b.y-f.h;f.vy=-2.3;f.bounces++}else f.dead=true}for(const e of enemies)if(e.alive&&overlap(f,e)){e.alive=false;f.dead=true;addScore(200);sound('stomp')}if(f.x<cam-16||f.x>cam+W+20||f.y>250)f.dead=true}fireballs=fireballs.filter(f=>!f.dead);
for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=.14;q.life--}particles=particles.filter(q=>q.life>0);
}
function die(){if(mode!=='playing')return;sound('die');lives--;if(lives<1){mode='over';return}const form=player.form;player.x=Math.max(32,cam+24);player.y=180;player.vx=0;player.vy=-3;player.form=form;player.inv=100;}
function clearCourse(){if(mode!=='playing')return;bonus=Math.max(0,Math.floor(worldTime)*50);score+=bonus;mode='clear';sound('clear');for(let i=0;i<8;i++)fireworks.push({x:35+i*27,y:80+Math.random()*65,life:70,color:['#fff45c','#ff6363','#7fffd4'][i%3]})}
function drawCloud(x,y,s=1){ctx.fillStyle='#fff';ctx.fillRect(x+4*s,y,16*s,6*s);ctx.fillRect(x,y+5*s,29*s,7*s);ctx.fillRect(x+8*s,y-3*s,10*s,4*s)}
function drawHill(x,y,s=1){ctx.fillStyle='#00a800';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+22*s,y-42*s,x+48*s,y);ctx.fill();ctx.fillRect(x-2,y-2,52*s,4);ctx.fillStyle='#fff';for(let i=0;i<3;i++){ctx.fillRect(x+20*s+i*6,y-18*s+i%2*4,3,3)}}
function drawBush(x,y,s=1){ctx.fillStyle='#00a800';ctx.fillRect(x+7*s,y-10*s,26*s,10*s);ctx.fillRect(x,y-6*s,44*s,6*s);ctx.fillRect(x+4*s,y-12*s,12*s,7*s);ctx.fillRect(x+27*s,y-13*s,12*s,8*s)}
function drawBackground(){ctx.fillStyle=PAL.sky;ctx.fillRect(0,0,W,H);const par=cam*.45;for(let i=0;i<8;i++){let x=((i*80-par)%680+680)%680-30;drawCloud(x,34+(i%3)*24,i%3===0?1:.75)}for(let i=0;i<10;i++){let x=((i*112-par*.75)%900+900)%900-20;drawHill(x,224,1)}for(let i=0;i<12;i++){let x=((i*96-par)%900+900)%900-20;drawBush(x,224,.8)}}
function drawBlock(b){const x=Math.round(b.x-cam),y=Math.round(b.drawY??b.y);if(x<-20||x>W)return;let t=b.type;if(b.hidden||b.broken)return;if(t==='ground'){ctx.fillStyle='#c84c0c';ctx.fillRect(x,y,16,16);ctx.fillStyle='#f8b820';ctx.fillRect(x,y,16,3);ctx.fillStyle='#813209';ctx.fillRect(x+1,y+7,14,1);ctx.fillRect(x+6,y+3,1,4);ctx.fillRect(x+10,y+8,1,7);ctx.fillRect(x+2,y+12,4,1)}else if(t==='pipe'||t==='pipeTop'){ctx.fillStyle='#008000';ctx.fillRect(x,y,b.w,b.h);ctx.fillStyle='#00c800';ctx.fillRect(x+2,y,5,b.h);ctx.fillStyle='#006900';ctx.fillRect(x+b.w-4,y,4,b.h);ctx.fillStyle='#00a800';ctx.fillRect(x,y,b.w,3);if(t==='pipeTop'){ctx.fillStyle='#00d000';ctx.fillRect(x,y,5,b.h);ctx.fillStyle='#006800';ctx.fillRect(x+b.w-4,y,4,b.h)}}else if(t==='question'){ctx.fillStyle='#f8b820';ctx.fillRect(x,y,16,16);ctx.fillStyle='#ffdc55';ctx.fillRect(x+2,y+2,12,2);ctx.fillRect(x+2,y+2,2,12);ctx.fillStyle='#ad4a08';ctx.fillRect(x+1,y+14,14,2);ctx.fillRect(x+14,y+1,2,14);ctx.fillStyle='#fff0a0';ctx.font='bold 11px monospace';ctx.fillText('?',x+4,y+12)}else if(t==='brick'||t==='stair'){ctx.fillStyle='#c84c0c';ctx.fillRect(x,y,16,16);ctx.fillStyle='#f8b820';ctx.fillRect(x,y,16,2);ctx.fillRect(x,y+7,16,2);ctx.fillRect(x+7,y,2,8);ctx.fillRect(x+3,y+9,2,7);ctx.fillStyle='#80340b';ctx.fillRect(x,y+15,16,1)}else if(t==='hard'||t==='multi'){ctx.fillStyle='#c1c1c1';ctx.fillRect(x,y,16,16);ctx.fillStyle='#fff';ctx.fillRect(x+2,y+2,12,2);ctx.fillRect(x+2,y+2,2,12);ctx.fillStyle='#666';ctx.fillRect(x+12,y+4,2,10);ctx.fillRect(x+4,y+12,8,2)}else if(t==='used'){ctx.fillStyle='#a76a24';ctx.fillRect(x,y,16,16);ctx.fillStyle='#d38a35';ctx.fillRect(x+2,y+2,12,12)}}
function drawMario(){const p=player,x=Math.round(p.x-cam),y=Math.round(p.y);if(p.inv>0&&Math.floor(p.inv/4)%2)return;ctx.save();if(p.star)ctx.globalAlpha=.6+.4*Math.sin(p.anim*.5);ctx.translate(p.face<0?x+p.w:x,y);ctx.scale(p.face<0?-1:1,1);const big=p.form>0&&!p.crouch,dy=0;ctx.fillStyle='#7b2c10';ctx.fillRect(2,dy,8,3);ctx.fillStyle='#f03020';ctx.fillRect(1,dy+2,10,3);ctx.fillRect(3,dy+5,7,3);ctx.fillStyle='#ffbe78';ctx.fillRect(4,dy+5,6,5);ctx.fillStyle='#111';ctx.fillRect(8,dy+6,2,2);ctx.fillStyle='#e93020';ctx.fillRect(2,dy+10,9,4);ctx.fillStyle='#2040cf';ctx.fillRect(3,dy+11,7,4);ctx.fillRect(2,dy+13,9,3);ctx.fillStyle='#71320c';ctx.fillRect(1,dy+14,4,2);ctx.fillRect(8,dy+14,4,2);if(big){ctx.fillStyle='#e93020';ctx.fillRect(2,dy+15,9,4);ctx.fillStyle='#2040cf';ctx.fillRect(3,dy+18,7,5);ctx.fillStyle='#71320c';ctx.fillRect(1,dy+22,5,2);ctx.fillRect(8,dy+22,5,2)}if(p.form===2){ctx.fillStyle='#fff';ctx.fillRect(3,dy+2,2,2);ctx.fillRect(8,dy+2,2,2)}ctx.restore()}
function drawEnemy(e){const x=Math.round(e.x-cam),y=Math.round(e.y);if(x<-20||x>W+20)return;if(e.type==='goomba'){if(e.state==='squash')return;ctx.fillStyle='#8c3d13';ctx.fillRect(x+3,y+3,10,8);ctx.fillRect(x+1,y+7,14,5);ctx.fillStyle='#fff';ctx.fillRect(x+4,y+7,3,4);ctx.fillRect(x+9,y+7,3,4);ctx.fillStyle='#111';ctx.fillRect(x+5,y+9,1,2);ctx.fillRect(x+10,y+9,1,2);ctx.fillStyle='#60310d';ctx.fillRect(x+1,y+14,5,2);ctx.fillRect(x+10,y+14,5,2)}else{ctx.fillStyle='#008b37';ctx.fillRect(x+3,y,10,5);ctx.fillStyle='#f3cd53';ctx.fillRect(x+2,y+4,12,7);ctx.fillStyle='#147c2d';ctx.fillRect(x+2,y+10,12,5);ctx.fillStyle='#f8d650';ctx.fillRect(x+4,y+5,3,3);ctx.fillRect(x+10,y+5,3,3);ctx.fillStyle='#111';ctx.fillRect(x+5,y+6,1,2);ctx.fillRect(x+11,y+6,1,2);if(e.state==='shell'){ctx.fillStyle='#08732a';ctx.fillRect(x+2,y+4,12,8);ctx.fillStyle='#cde058';ctx.fillRect(x+5,y+6,6,1)}}}
function drawItem(i){const x=Math.round(i.x-cam),y=Math.round(i.y);if(x<-12||x>W+12)return;if(i.type==='coin'){ctx.fillStyle='#ffeb44';ctx.fillRect(x+2,y,4,12);ctx.fillStyle='#fff49a';ctx.fillRect(x+3,y+2,2,8);return}if(i.type==='mushroom'||i.type==='1up'){ctx.fillStyle=i.type==='1up'?'#20ce49':'#ed3424';ctx.fillRect(x,y+3,8,6);ctx.fillRect(x+1,y,6,5);ctx.fillStyle='#fff';ctx.fillRect(x+1,y+2,2,2);ctx.fillRect(x+5,y+4,2,2);ctx.fillStyle='#fbe1af';ctx.fillRect(x+2,y+8,4,4)}else if(i.type==='flower'){ctx.fillStyle='#f33';ctx.fillRect(x+2,y,4,5);ctx.fillStyle='#ffe648';ctx.fillRect(x,y+3,3,4);ctx.fillRect(x+5,y+3,3,4);ctx.fillStyle='#fff';ctx.fillRect(x+2,y+3,4,4);ctx.fillStyle='#188f24';ctx.fillRect(x+3,y+7,2,5)}else{ctx.fillStyle='#ffe928';ctx.fillRect(x+3,y,2,12);ctx.fillRect(x,y+3,8,2);ctx.fillRect(x+1,y+1,2,2);ctx.fillRect(x+5,y+1,2,2);ctx.fillRect(x+1,y+8,2,2);ctx.fillRect(x+5,y+8,2,2)}}
function drawGoal(){let fx=Math.round(3152-cam);ctx.fillStyle='#fff';ctx.fillRect(fx,54,2,170);ctx.fillStyle='#00a800';ctx.fillRect(fx-2,52,6,6);ctx.fillStyle='#f03020';ctx.fillRect(fx+2,58,22,12);ctx.fillRect(fx+2,70,14,7);ctx.fillStyle='#fff';ctx.fillRect(fx+8,60,3,3);ctx.fillRect(fx+4,224,14,3);const cx=Math.round(3200-cam);ctx.fillStyle='#c84c0c';ctx.fillRect(cx,172,40,52);ctx.fillRect(cx+5,162,30,10);ctx.fillRect(cx+11,154,14,8);ctx.fillStyle='#f8b820';ctx.fillRect(cx+11,185,18,39);ctx.fillRect(cx+16,181,8,4);ctx.fillStyle='#80340b';ctx.fillRect(cx+16,195,8,29)}
function drawHUD(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,28);ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textBaseline='top';ctx.textAlign='left';ctx.fillText('MARIO',12,4);ctx.fillText(String(score).padStart(6,'0'),12,14);ctx.fillText('×'+String(lives).padStart(2,'0'),72,14);ctx.fillStyle='#ffde31';ctx.fillText('●'+String(coins).padStart(2,'0'),110,14);ctx.fillStyle='#fff';ctx.fillText('WORLD',164,4);ctx.fillText('1-1',176,14);ctx.fillText('TIME',218,4);ctx.fillText(String(Math.max(0,Math.floor(worldTime))).padStart(3,'0'),218,14);if(muted){ctx.fillStyle='#ff5d52';ctx.fillText('MUTE',225,23)}}
function drawFireworks(){for(const f of fireworks){if(f.life<=0)continue;ctx.fillStyle=f.color;for(let i=0;i<8;i++){const a=i*Math.PI/4,r=(70-f.life)*.55;ctx.fillRect(Math.round(f.x+Math.cos(a)*r),Math.round(f.y+Math.sin(a)*r),2,2)}f.life--}}
function centerText(text,y,size=12,color='#fff'){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,128,y);ctx.textAlign='left'}
function drawOverlay(){if(mode==='title'){ctx.fillStyle='#0009';ctx.fillRect(14,48,228,145);centerText('SUPER MARIO BROS.',75,15,'#ff4538');centerText('WORLD 1-1',99,11,'#ffd847');centerText('A classic side-scrolling adventure',121,7);centerText('RUN • JUMP • REACH THE FLAG',139,7);centerText('PRESS ENTER OR SPACE',165,9,'#fff27a');centerText('3 LIVES  ·  400 SECONDS',181,7)}else if(mode==='paused'){ctx.fillStyle='#0009';ctx.fillRect(54,91,148,52);centerText('PAUSED',110,14,'#ffe45c');centerText('ENTER TO RESUME',130,7)}else if(mode==='over'||mode==='clear'){ctx.fillStyle='#000a';ctx.fillRect(20,66,216,108);if(mode==='over'){centerText('GAME OVER',91,16,'#ff4a38');centerText('FINAL SCORE  '+String(score).padStart(6,'0'),117,8);centerText('ENTER TO PLAY AGAIN',148,8,'#fff27a')}else{centerText('COURSE CLEAR!',85,15,'#fff14e');centerText('TIME BONUS  '+String(bonus).padStart(6,'0'),110,8);centerText('WORLD 1-1  COMPLETE',129,8);centerText('ENTER TO PLAY AGAIN',153,8,'#fff27a')}}}
function render(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBackground();for(const b of blocks)drawBlock(b);drawGoal();for(const i of items)drawItem(i);for(const e of enemies)drawEnemy(e);for(const f of fireballs){ctx.fillStyle='#ff7118';ctx.fillRect(Math.round(f.x-cam),Math.round(f.y),6,6);ctx.fillStyle='#ffe94a';ctx.fillRect(Math.round(f.x-cam)+2,Math.round(f.y)+2,2,2)}for(const q of particles){ctx.fillStyle=q.type==='brick'?'#f8b820':'#fff';ctx.fillRect(Math.round(q.x-cam),Math.round(q.y),3,3)}drawMario();drawHUD();if(mode==='clear')drawFireworks();drawOverlay();ctx.restore()}
const installButton=document.querySelector('#installApp'),installGuide=document.querySelector('#installGuide'),guideIntro=document.querySelector('#guideIntro'),guideSteps=document.querySelector('#guideSteps'),guideInstall=document.querySelector('#guideInstall');let installPrompt=null;const isInstalled=()=>window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;if(isInstalled())installButton.hidden=true;function showInstallGuide(){const ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1),isAndroid=/Android/i.test(ua);guideSteps.replaceChildren();let intro,steps;if(isIOS){intro='Add the game to your Home Screen to launch it like an app.';steps=['Open this page in Safari.','Tap the Share button.','Choose “Add to Home Screen”, then tap Add.']}else if(isAndroid){intro='Install the game for a full-screen app experience and offline play.';steps=['Open your browser menu (⋮).','Tap “Install app” or “Add to Home screen”.','Confirm the install.']}else{intro='Install the game from your browser to add it to your device.';steps=['Open your browser menu or address-bar install icon.','Choose “Install World 1-1”.','Launch it from your Home Screen or app list.']}guideIntro.textContent=intro;for(const text of steps){const li=document.createElement('li');li.textContent=text;guideSteps.append(li)}guideInstall.hidden=!installPrompt;if(typeof installGuide.showModal==='function')installGuide.showModal();else installGuide.setAttribute('open','')}async function runInstallPrompt(){if(!installPrompt)return;const prompt=installPrompt;installPrompt=null;guideInstall.hidden=true;try{await prompt.prompt();const result=await prompt.userChoice;if(result.outcome==='accepted')installButton.hidden=true}catch{}if(installGuide.open)installGuide.close()}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installButton.classList.add('visible');if(installGuide.open)guideInstall.hidden=false});window.addEventListener('appinstalled',()=>{installPrompt=null;installButton.hidden=true;if(installGuide.open)installGuide.close()});installButton.addEventListener('click',()=>{if(installPrompt)runInstallPrompt();else showInstallGuide()});guideInstall.addEventListener('click',runInstallPrompt);document.querySelector('#closeGuide').addEventListener('click',()=>installGuide.close());installGuide.addEventListener('click',e=>{if(e.target===installGuide)installGuide.close()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
const melody=[659,659,659,523,659,784,392,523,392,330,440,494,466,440,392,659,784,880,698,784,659,523,587,494];
function music(){if(muted||!audio)return;const hurry=worldTime<=100;const div=hurry?8:13;if(ticks%div!==0)return;const note=melody[musicStep++%melody.length],now=audio.currentTime;for(const [freq,dur,type,vol] of [[note,.11,'square',.025],[note/2,.16,'triangle',.018]]){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+dur)}}
function step(){ticks++;if(mode==='playing'){if(comboWindow>0)comboWindow--;else stompCombo=0;physics();if(ticks%60===0){worldTime--;if(worldTime<=100&&worldTime>0){}if(worldTime<=0){worldTime=0;die();if(mode==='playing')mode='over'}}music()}}
function loop(now){if(!last)last=now;let dt=Math.min(.25,(now-last)/1000);last=now;acc+=dt;const frame=1/60;while(acc>=frame){step();acc-=frame}render();requestAnimationFrame(loop)}
