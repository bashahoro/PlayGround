<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10101d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2310101d'/%3E%3Cpath d='m19 19 26 26M45 19 19 45' stroke='%2366e5c1' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>إكس أو — جولة ممتعة</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap');
    :root{color-scheme:dark;--bg:#10101d;--panel:#191927;--panel2:#202031;--line:#303044;--muted:#a3a2b8;--white:#f7f5ff;--mint:#66e5c1;--pink:#ff829f;--yellow:#f6d87a;--purple:#a995ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--white);font-family:'Alexandria',system-ui,sans-serif;background:radial-gradient(ellipse at 50% -18%,#343050 0,transparent 52%),radial-gradient(circle at 8% 84%,#1e2c36 0,transparent 28%),var(--bg);display:flex;justify-content:center;align-items:center;padding:24px 18px 34px;overflow-x:hidden}
    button{font:inherit;color:inherit}
    .app{width:min(100%,520px);position:relative}
    .topline{display:flex;align-items:center;justify-content:space-between;margin:0 3px 22px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-icon{width:45px;height:45px;display:grid;place-items:center;border:1px solid #47435f;border-radius:15px;background:linear-gradient(145deg,#29263e,#1c1b2b);font-size:23px;box-shadow:0 7px 22px #0004}
    .brand-title{font-size:14px;font-weight:700;letter-spacing:.01em}.brand-sub{font-size:10px;color:var(--muted);margin-top:3px}
    .sound-btn{border:1px solid var(--line);background:#1b1b2a;width:42px;height:42px;border-radius:14px;cursor:pointer;color:#c5c2d6;display:grid;place-items:center;transition:.2s}
    .sound-btn:hover{border-color:#686283;color:white;transform:translateY(-2px)}.sound-btn svg{width:18px;height:18px}
    .intro{text-align:center;margin:0 0 22px}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--purple);font-weight:600;margin-bottom:8px}.intro h1{font-size:clamp(29px,7vw,39px);line-height:1.28;margin:0;font-weight:800;letter-spacing:-.055em}.intro h1 span{color:var(--mint)}.intro p{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.8}
    .game-card{padding:21px;border:1px solid #343346;background:linear-gradient(145deg,#1d1d2b,#171723 75%);border-radius:26px;box-shadow:0 26px 70px #0006, inset 0 1px #ffffff08}
    .mode-switch{padding:4px;display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid #303043;background:#14141f;border-radius:15px;margin-bottom:19px}
    .mode-btn{height:40px;border:0;border-radius:11px;color:#a8a6bb;background:transparent;cursor:pointer;font-size:11px;font-weight:600;transition:.2s}
    .mode-btn.active{background:#2b293c;color:#f8f6ff;box-shadow:inset 0 0 0 1px #49445f}
    .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#14141f;border:1px solid #2c2c3e;border-radius:17px;padding:12px 15px;margin-bottom:16px}
    .player{text-align:center;display:flex;align-items:center;gap:9px;justify-content:center}.player.right{flex-direction:row-reverse}.player-mark{font-size:20px;font-weight:800;line-height:1}.player-mark.x{color:var(--mint)}.player-mark.o{color:var(--pink)}.player-name{font-size:10px;color:#c6c4d5;font-weight:600}.score{font-size:22px;font-weight:700;line-height:1;margin-top:3px}.score.x{color:var(--mint)}.score.o{color:var(--pink)}.score-divider{width:1px;height:30px;background:#353548;margin:0 13px}
    .status{min-height:36px;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px;color:#e0deec;font-size:12px;font-weight:600}.status-dot{width:8px;height:8px;background:var(--mint);border-radius:50%;box-shadow:0 0 12px #66e5c188}.status.winner .status-dot{background:var(--yellow);box-shadow:0 0 12px #f6d87a99}.status.draw .status-dot{background:var(--purple);box-shadow:0 0 12px #a995ff99}
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;max-width:380px;margin:0 auto}
    .cell{aspect-ratio:1;border:1px solid #37364a;background:linear-gradient(145deg,#262536,#20202e);border-radius:17px;cursor:pointer;display:grid;place-items:center;position:relative;transition:transform .16s,background .2s,border-color .2s;box-shadow:inset 0 1px #ffffff06;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .cell:empty:hover:not(:disabled){background:#2c2b3e;border-color:#625c7b;transform:translateY(-2px)}.cell:disabled{cursor:default}.cell svg{width:45%;height:45%;overflow:visible}.cell .x-mark{stroke:var(--mint);filter:drop-shadow(0 0 8px #66e5c133)}.cell .o-mark{stroke:var(--pink);filter:drop-shadow(0 0 8px #ff829f33)}
    .cell.filled{animation:pop .24s cubic-bezier(.2,.8,.2,1)}@keyframes pop{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1);opacity:1}}
    .cell.winning{background:#2e2c3d;border-color:#a995ff;box-shadow:0 0 20px #a995ff1c,inset 0 0 18px #a995ff0b}.cell.winning svg{filter:drop-shadow(0 0 10px currentColor)}
    .actions{display:flex;justify-content:center;gap:10px;margin-top:18px}.action{height:42px;border-radius:13px;border:1px solid #3b394e;background:#242333;color:#eeecf7;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s}.action:hover{transform:translateY(-2px);background:#302e42;border-color:#57536c}.action.primary{background:#b3a2ff;border-color:#b3a2ff;color:#171423;box-shadow:0 6px 19px #a995ff26}.action.primary:hover{background:#c1b4ff}.action svg{width:15px;height:15px}
    .hint{text-align:center;color:#77768c;font-size:10px;line-height:1.8;margin:16px 4px 0}.hint b{color:#aaa7c0;font-weight:500}
    .toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,14px);background:#29283b;border:1px solid #4b4763;color:#f6f4ff;padding:11px 18px;border-radius:13px;font-size:11px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px #0005;z-index:5;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .confetti{position:fixed;top:-12px;width:7px;height:12px;border-radius:2px;z-index:4;pointer-events:none;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(650deg);opacity:0}}
    @media(max-width:430px){body{padding:17px 14px calc(22px + env(safe-area-inset-bottom))}.topline{margin-bottom:18px}.intro{margin-bottom:18px}.game-card{padding:16px;border-radius:22px}.board{gap:8px}.cell{border-radius:14px}.scoreboard{padding:11px 9px}.player{gap:6px}.score-divider{margin:0 8px}.actions{margin-top:15px}.hint{margin-top:13px}}
    @media(max-height:730px) and (min-width:500px){body{align-items:flex-start}.topline{margin-bottom:13px}.intro{margin-bottom:14px}.intro p{margin-top:5px}.game-card{padding:17px}.mode-switch{margin-bottom:13px}.scoreboard{margin-bottom:11px;padding:9px 15px}.status{margin-bottom:8px;min-height:29px}.board{max-width:340px;gap:8px}.actions{margin-top:13px}.hint{margin-top:10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand"><div class="brand-icon" aria-hidden="true">✳</div><div><div class="brand-title">استراحة لعب</div><div class="brand-sub">تحدّى شخصًا تحبه</div></div></div>
      <button class="sound-btn" id="soundToggle" type="button" aria-label="تشغيل الصوت" title="الصوت">
        <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
    </header>
    <section class="intro"><div class="eyebrow">لعبة كلاسيكية، متعة لا تنتهي</div><h1>إكس <span>أو</span></h1><p>كوّن ثلاثة رموز على خط واحد لتفوز بالجولة!</p></section>
    <section class="game-card" aria-label="لعبة إكس أو">
      <div class="mode-switch" role="group" aria-label="اختيار طريقة اللعب">
        <button class="mode-btn active" id="friendMode" type="button" aria-pressed="true">👥 &nbsp;لاعبان</button>
        <button class="mode-btn" id="computerMode" type="button" aria-pressed="false">✨ &nbsp;ضد الكمبيوتر</button>
      </div>
      <div class="scoreboard" aria-label="النتيجة">
        <div class="player right"><span class="player-mark x">×</span><div><div class="player-name" id="xName">اللاعب الأول</div><div class="score x" id="xScore">0</div></div></div>
        <div class="score-divider"></div>
        <div class="player"><span class="player-mark o">○</span><div><div class="player-name" id="oName">اللاعب الثاني</div><div class="score o" id="oScore">0</div></div></div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"><span class="status-dot"></span><span id="statusText">دور اللاعب الأول — ابدأ اللعب!</span></div>
      <div class="board" id="board" role="grid" aria-label="لوحة إكس أو"></div>
      <div class="actions">
        <button class="action primary" id="newRound" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>جولة جديدة</button>
        <button class="action" id="resetGame" type="button">إعادة النتيجة</button>
      </div>
    </section>
    <p class="hint">اللاعب الأول يبدأ دائمًا بالرمز <b>×</b> &nbsp;·&nbsp; اضغط على أي مربع لتضع رمزك</p>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    (() => {
      const boardEl = document.getElementById('board');
      const status = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const toast = document.getElementById('toast');
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      let cells = Array(9).fill(''), turn = 'X', over = false, mode = 'friend', scores = {X:0,O:0}, soundOn = false, audioCtx, toastTimer;
      const cellButtons = [];
      const glyph = mark => mark === 'X'
        ? '<svg class="x-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="m11 11 26 26M37 11 11 37"/></svg>'
        : '<svg class="o-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" aria-hidden="true"><circle cx="24" cy="24" r="14"/></svg>';
      for (let i=0;i<9;i++) {
        const button = document.createElement('button');
        button.className = 'cell'; button.type = 'button'; button.setAttribute('role','gridcell');
        button.setAttribute('aria-label',`المربع ${i+1}، فارغ`);
        button.addEventListener('click', () => playAt(i));
        boardEl.appendChild(button); cellButtons.push(button);
      }
      function setStatus(text, kind='') { statusText.textContent = text; status.className = `status ${kind}`.trim(); }
      function updateNames() {
        document.getElementById('xName').textContent = mode === 'computer' ? 'أنت' : 'اللاعب الأول';
        document.getElementById('oName').textContent = mode === 'computer' ? 'الكمبيوتر' : 'اللاعب الثاني';
      }
      function render() {
        cellButtons.forEach((button,i) => {
          button.innerHTML = cells[i] ? glyph(cells[i]) : '';
          button.classList.toggle('filled',Boolean(cells[i]));
          button.disabled = Boolean(cells[i]) || over || (mode === 'computer' && turn === 'O');
          button.setAttribute('aria-label',`المربع ${i+1}${cells[i] ? `، ${cells[i] === 'X' ? 'إكس' : 'أو'}` : '، فارغ'}`);
          button.classList.toggle('winning',Boolean(button.dataset.winning));
        });
        document.getElementById('xScore').textContent = scores.X;
        document.getElementById('oScore').textContent = scores.O;
      }
      function sound(freq=420,duration=.08) {
        if(!soundOn) return;
        try { audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const osc=audioCtx.createOscillator(), gain=audioCtx.createGain(); osc.frequency.value=freq; osc.type='sine'; gain.gain.setValueAtTime(.055,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+duration); } catch(_) {}
      }
      function getWin(state) { return wins.find(line => line.every(i => state[i] && state[i] === state[line[0]])); }
      function playAt(index) {
        if(over || cells[index] || (mode==='computer' && turn==='O')) return;
        place(index, turn);
        if(!over && mode==='computer') { setStatus('الكمبيوتر يفكر...'); window.setTimeout(computerMove,420); }
      }
      function place(index, mark) {
        cells[index]=mark; sound(mark==='X'?520:390,.1); render();
        const line=getWin(cells);
        if(line) {
          over=true; line.forEach(i => {cellButtons[i].dataset.winning='true'; cellButtons[i].classList.add('winning');});
          scores[mark]++; render();
          const winner = mark==='X' ? (mode==='computer'?'أنت':'اللاعب الأول') : (mode==='computer'?'الكمبيوتر':'اللاعب الثاني');
          setStatus(`🎉 ${winner} فاز بالجولة!`,'winner'); sound(700,.25); confetti();
          return;
        }
        if(cells.every(Boolean)) { over=true; setStatus('تعادل جميل! لا غالب ولا مغلوب.','draw'); sound(330,.22); return; }
        turn=mark==='X'?'O':'X';
        setStatus(mode==='computer' ? (turn==='X'?'دورك — اختر مربعًا':'دور الكمبيوتر') : `دور ${turn==='X'?'اللاعب الأول':'اللاعب الثاني'} — ${turn==='X'?'×':'○'}`);
      }
      function computerMove() {
        if(over || mode!=='computer' || turn!=='O') return;
        // Minimax keeps the computer challenging but fair: it never misses a win or a block.
        let best=-Infinity, move=-1;
        cells.forEach((value,i) => { if(!value) { cells[i]='O'; const score=minimax(cells,0,false); cells[i]=''; if(score>best){best=score;move=i;} } });
        if(move>=0) place(move,'O');
      }
      function minimax(state,depth,maximizing) {
        const line=getWin(state); if(line) return state[line[0]]==='O'?10-depth:depth-10;
        if(state.every(Boolean)) return 0;
        if(maximizing) { let best=-Infinity; for(let i=0;i<9;i++) if(!state[i]) {state[i]='O';best=Math.max(best,minimax(state,depth+1,false));state[i]='';} return best; }
        let best=Infinity; for(let i=0;i<9;i++) if(!state[i]) {state[i]='X';best=Math.min(best,minimax(state,depth+1,true));state[i]='';} return best;
      }
      function startRound() { cells=Array(9).fill('');turn='X';over=false;cellButtons.forEach(b=>{delete b.dataset.winning;b.classList.remove('winning')}); render();setStatus(mode==='computer'?'دورك — اختر مربعًا':'دور اللاعب الأول — ابدأ اللعب!'); }
      function setMode(next) {
        mode=next; document.getElementById('friendMode').classList.toggle('active',mode==='friend');
        document.getElementById('computerMode').classList.toggle('active',mode==='computer');
        document.getElementById('friendMode').setAttribute('aria-pressed',mode==='friend');document.getElementById('computerMode').setAttribute('aria-pressed',mode==='computer');
        scores={X:0,O:0};updateNames();startRound();showToast(mode==='computer'?'حظًا موفقًا! الكمبيوتر لا يستهان به 🤖':'العبوا بالتناوب واستمتعوا!');
      }
      function showToast(message) { toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100); }
      function confetti() {
        const colors=['#66e5c1','#ff829f','#f6d87a','#a995ff'];
        for(let i=0;i<34;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.left=`${Math.random()*100}vw`;bit.style.background=colors[i%colors.length];bit.style.animationDelay=`${Math.random()*.55}s`;bit.style.transform=`translateX(${Math.random()*55-28}px)`;document.body.appendChild(bit);setTimeout(()=>bit.remove(),2500);}
      }
      document.getElementById('friendMode').addEventListener('click',()=>{if(mode!=='friend')setMode('friend')});
      document.getElementById('computerMode').addEventListener('click',()=>{if(mode!=='computer')setMode('computer')});
      document.getElementById('newRound').addEventListener('click',startRound);
      document.getElementById('resetGame').addEventListener('click',()=>{scores={X:0,O:0};startRound();showToast('تمت إعادة النتيجة');});
      document.getElementById('soundToggle').addEventListener('click',event=>{soundOn=!soundOn;event.currentTarget.setAttribute('aria-label',soundOn?'كتم الصوت':'تشغيل الصوت');document.getElementById('soundIcon').innerHTML=soundOn?'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9l5 6M20 9l-5 6"/>':'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>';showToast(soundOn?'تم تشغيل الصوت':'تم كتم الصوت');if(soundOn)sound();});
      render();
    })();
  </script>
</body>
</html>
